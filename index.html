<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - ST Shop Bangladesh</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-container h2 { color: #ff5722; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .login-html { background: #ff5722; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .login-btn:hover { background: #e64a19; }
        .back-link { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #333; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>ST Shop BD লগইন</h2>
        <form onsubmit="event.preventDefault(); alert('লগইন সফল হয়েছে!');">
            <div class="input-group">
                <label for="email">জিমেইল (Email)</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label for="password">পাসওয়ার্ড (Password)</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="submit" class="login-btn">লগইন করুন</button>
        </form>
        <a href="index.html" class="back-link">&#8592; হোম পেজে ফিরে যান</a>
    </div>

</body>
</html>
